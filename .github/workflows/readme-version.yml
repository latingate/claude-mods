# Keeps the version shown in each mod's README.md (the badge at the top and
# any sample "Version:" line) equal to the "version" in that mod's
# .claude-plugin/plugin.json.
name: Sync README version badges

on:
  push:
    branches: [main]
    paths:
      - '*/.claude-plugin/plugin.json'
      - '*/README.md'
      - '.github/workflows/readme-version.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write each mod's version into its README
        run: |
          for manifest in */.claude-plugin/plugin.json; do
            readme="${manifest%%/*}/README.md"
            [ -f "$readme" ] || continue
            version=$(jq -r .version "$manifest")
            # shields.io static badges escape a dash as a double dash
            badge=${version//-/--}
            sed -i -E \
              -e "s#(https://img\.shields\.io/badge/version-)[^ )]*(-blue\))#\1${badge}\2#" \
              -e "s#^( *Version: ).*#\1${version}#" \
              "$readme"
          done

      - name: Commit if a version changed
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Sync README version badges with plugin.json"
          git push
